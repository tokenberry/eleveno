<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;600;700&family=Space+Mono:wght@700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #F5B70E; } a:hover { color: #ffd45e; }
  </style>
</helmet>
<div style="width: 2304px; height: 3456px; display: flex; flex-direction: column; background: #0E2350; font-family: Archivo, system-ui, sans-serif; overflow: hidden;">

  <div style="height: 300px; background: #0E2350; border-bottom: 10px solid #F5B70E; display: flex; align-items: center; justify-content: center; flex: 0 0 auto;">
    <img src="mark-v.png" alt="ELEVENO" style="height: 138px; width: auto; display: block;">
  </div>

  <div style="flex: 1 1 auto; display: flex; flex-direction: column; justify-content: space-between; align-items: {{align}}; padding: 150px 160px 130px; text-align: {{textAlign}};">

    <div style="display: flex; flex-direction: column; align-items: {{align}}; gap: 26px;">
      <div style="font-family: 'Space Mono', ui-monospace, monospace; font-weight: 700; font-size: 46px; letter-spacing: 13px; color: #F5B70E;">GROUPS OF 8 TO 200+</div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: {{align}};">
      <div style="font-family: Anton, Impact, 'Arial Narrow Bold', sans-serif; font-size: 320px; line-height: 0.9; letter-spacing: 2px; color: #F5F0E4;">PRIVATE</div>
      <div style="font-family: Anton, Impact, 'Arial Narrow Bold', sans-serif; font-size: 320px; line-height: 0.9; letter-spacing: 2px; color: #F5F0E4;">EVENT SPACE</div>
    </div>

    <svg viewBox="0 0 240 100" style="width: 1820px; height: auto; display: block; transform: {{arrowTransform}};" aria-hidden="true" focusable="false">
      <path d="M0 34 H150 V4 L236 50 L150 96 V66 H0 Z" fill="#F5B70E"></path>
    </svg>

  </div>

  <div style="flex: 0 0 auto; background: #0A1A3A; border-top: 10px solid #F5B70E; display: flex; align-items: center; justify-content: center; padding: 66px 160px;">
    <div style="font-family: 'Space Mono', ui-monospace, monospace; font-weight: 700; font-size: 46px; letter-spacing: 8px; color: #DCE3F0;">340 PATRIOT PLACE &middot; FOXBOROUGH MA</div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"direction":{"editor":"enum","options":["right","left"],"default":"right","section":"Sign"},"$preview":{"width":2304,"height":3456}}'>
class Component extends DCLogic {
  renderVals() {
    const left = (this.props.direction ?? 'right') === 'left';
    return {
      align: left ? 'flex-start' : 'flex-end',
      textAlign: left ? 'left' : 'right',
      arrowTransform: left ? 'scaleX(-1)' : 'none'
    };
  }
}
</script>
</body>
</html>
