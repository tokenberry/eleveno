<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;600;700&family=Space+Mono:wght@700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #F5B70E; } a:hover { color: #ffd45e; }
  </style>
</helmet>
<div style="width: 2304px; height: 3456px; display: flex; flex-direction: column; background: #0E2350; font-family: Archivo, system-ui, sans-serif; overflow: hidden;">

  <div style="height: 300px; background: #0A1A3A; display: flex; align-items: center; justify-content: center; flex: 0 0 auto;">
    <img src="mark-v.png" alt="ELEVENO" style="height: 138px; width: auto; display: block;">
  </div>

  <div style="flex: 1 1 auto; display: flex; flex-direction: column; justify-content: space-between; padding: 150px 160px 130px;">

    <div style="display: flex; flex-direction: column; gap: 26px;">
      <div style="font-family: 'Space Mono', ui-monospace, monospace; font-weight: 700; font-size: 46px; letter-spacing: 13px; color: #F5B70E;">SEPTEMBER &ndash; NOVEMBER</div>
      <div style="height: 10px; background: #F5B70E; width: 420px;"></div>
    </div>

    <div style="display: flex; flex-direction: column;">
      <div style="font-family: Anton, Impact, 'Arial Narrow Bold', sans-serif; font-size: 360px; line-height: 0.88; letter-spacing: 2px; color: #F5F0E4;">FALL</div>
      <div style="font-family: Anton, Impact, 'Arial Narrow Bold', sans-serif; font-size: 360px; line-height: 0.88; letter-spacing: 2px; color: #F5F0E4;">MEMBERSHIP</div>
      <div style="display: flex; align-items: flex-end; gap: 40px; margin-top: 70px;">
        <div style="font-family: Anton, Impact, sans-serif; font-size: 480px; line-height: 0.82; letter-spacing: 0px; color: #F5B70E;">$300</div>
        <div style="font-family: 'Space Mono', ui-monospace, monospace; font-weight: 700; font-size: 50px; line-height: 1.45; letter-spacing: 6px; color: #8CBADF; padding-bottom: 36px;">FOR THE<br>FULL SEASON</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 40px;">
      <div style="font-family: Archivo, system-ui, sans-serif; font-weight: 500; font-size: 76px; line-height: 1.26; color: #DCE3F0; max-width: 1800px; text-wrap: pretty;">Joining mid-season? You only pay for the days that are left.</div>
      <div style="align-self: flex-start; background: #F5B70E; color: #0E2350; font-family: Anton, Impact, sans-serif; font-size: 96px; line-height: 1; letter-spacing: 5px; padding: 34px 56px 42px;">JOIN AT THE FRONT DESK</div>
    </div>

  </div>

  <div style="flex: 0 0 auto; background: #0A1A3A; display: flex; align-items: center; justify-content: space-between; gap: 60px; padding: 66px 160px;">
    <div style="display: flex; flex-direction: column; gap: 18px;">
      <div style="font-family: Anton, Impact, sans-serif; font-size: 118px; line-height: 1; letter-spacing: 3px; color: #F5B70E;">SIGN UP HERE</div>
      <div style="font-family: 'Space Mono', ui-monospace, monospace; font-weight: 700; font-size: 44px; letter-spacing: 5px; color: #DCE3F0;">340 PATRIOT PLACE &middot; FOXBOROUGH</div>
    </div>
    <div style="background: #F5F0E4; padding: 30px; border-radius: 10px; flex: 0 0 auto; display: flex;">
      <img src="qr-membership.svg" alt="Scan to join the fall membership" style="width: 300px; height: 300px; display: block;">
    </div>
  </div>

</div>
</x-dc>

</html>
