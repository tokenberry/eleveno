# Decap CMS — the admin UI for the membership section.
# Edits here are committed straight back to the repo, which triggers a rebuild.

backend:
  name: github
  repo: tokenberry/eleveno
  branch: main
  base_url: https://api.netlify.com   # Netlify's OAuth proxy handles the GitHub login

publish_mode: simple
site_url: https://www.eleveno.com
display_url: https://www.eleveno.com
locale: en

# No image uploads are needed yet, but Decap requires these to be set.
media_folder: assets
public_folder: assets

collections:
  - name: calendar
    label: Calendar
    files:
      - name: events
        label: Now Playing events
        file: src/data/events.json
        description: >
          The event list on the home page. Add an event, drag to reorder, or
          delete one that has finished. Events appear in the order shown here.
        fields:
          - name: viewAllUrl
            label: "\"View full calendar\" link"
            widget: string
            required: false
            hint: Leave empty to link to the booking section further down the home page.
          - name: events
            label: Events
            label_singular: Event
            widget: list
            required: false
            summary: "{{fields.when}} — {{fields.title}}"
            fields:
              - { name: when, label: Day and time, widget: string, hint: "Shown on the left, for example: TUE · 7:00 PM" }
              - { name: title, label: Event name, widget: string }
              - { name: url, label: Sign-up link, widget: string, required: false, hint: "Paste the full link. Leave empty and the event shows with no button." }
              - { name: ctaLabel, label: Button text, widget: string, default: Sign Up, required: false }
              - { name: featured, label: Highlight this event, widget: boolean, default: false, required: false }
          - { name: _comment, label: Note to editors, widget: hidden, required: false }

  - name: ask
    label: Home page question form
    files:
      - name: ask
        label: "\"Have questions?\" section"
        file: src/data/ask.json
        description: >
          The short question form on the home page. Submissions go to Netlify
          under the form name "general-question" — separate from the private
          events form.
        fields:
          - { name: eyebrow, label: Small line above the heading, widget: string }
          - { name: heading, label: Heading, widget: string }
          - { name: subheading, label: Handwritten line under it, widget: string }
          - { name: lead, label: Intro paragraph, widget: text }
          - { name: badgeValue, label: Badge big text, widget: string, required: false, hint: "For example: 24h. This is a promise to visitors — clear both badge fields to hide it rather than claim a response time you cannot keep." }
          - { name: badgeLabel, label: Badge small text, widget: string, required: false, hint: "For example: Response time" }
          - { name: submitLabel, label: Button text, widget: string }
          - { name: photo, label: Photo file name, widget: string, hint: "A file already in the assets folder, for example: community-champs.jpg" }
          - { name: photoAlt, label: Photo description, widget: string, hint: "Describes the photo for screen readers and when images fail to load." }
          - { name: _comment, label: Note to editors, widget: hidden, required: false }

  - name: visit
    label: Find us
    files:
      - name: visit
        label: Hours, map & contact
        file: src/data/visit.json
        description: >
          The Find Us section at the bottom of the home page. Email, phone and
          address are not here — they come from the site settings so they stay
          the same everywhere.
        fields:
          - { name: eyebrow, label: Small line above the heading, widget: string }
          - { name: heading, label: Heading, widget: string, hint: "First line, shown in cream" }
          - { name: headingAccent, label: Heading second line, widget: string, hint: "Shown in gold underneath" }
          - { name: lead, label: Intro line, widget: text }
          - { name: hoursHeading, label: Hours box title, widget: string }
          - name: hours
            label: Opening hours
            label_singular: Row
            widget: list
            summary: "{{fields.days}} — {{fields.time}}"
            fields:
              - { name: days, label: Day or range, widget: string, hint: "For example: Mon – Thu" }
              - { name: time, label: Hours, widget: string, hint: "For example: 8am – 10pm" }
          - name: mapEmbedUrl
            label: Map embed URL
            widget: string
            hint: >
              From Google Maps: Share → Embed a map → Copy HTML, then paste only
              the address from inside src="...".
          - { name: mapLinkUrl, label: Directions link, widget: string, hint: "Where the address row and the gold badge go when tapped." }
          - { name: mapBadgeTitle, label: Badge top line, widget: string }
          - { name: mapBadgeSub, label: Badge bottom line, widget: string }
          - { name: mapLinkLabel, label: Directions link text, widget: string, required: false }
          - { name: _comment, label: Note to editors, widget: hidden, required: false }

  - name: reviews
    label: Google reviews
    files:
      - name: reviews
        label: Reviews section
        file: src/data/reviews.json
        description: >
          The reviews shown near the bottom of the home page. Copy each review
          from your Google listing WORD FOR WORD — do not tidy up spelling or
          shorten it. It is someone else's words with their name on it, and
          Google's terms require reviews be shown unaltered.
        fields:
          - { name: eyebrow, label: Small line above the heading, widget: string, hint: "For example: Rated 5.0 on Google" }
          - { name: heading, label: Heading, widget: string }
          - { name: lead, label: Intro paragraph, widget: text }
          - { name: profileUrl, label: Link to your Google listing, widget: string }
          - { name: profileLabel, label: Text for that link, widget: string }
          - name: items
            label: Reviews
            label_singular: Review
            widget: list
            summary: "{{fields.name}} — {{fields.stars}}★"
            fields:
              - { name: name, label: Reviewer name, widget: string, hint: "As Google shows it, for example: Haley M" }
              - { name: when, label: When they posted, widget: string, required: false, hint: "As Google shows it, for example: 3 months ago. This goes out of date — refresh it when you update the reviews, or leave it empty to hide it." }
              - { name: stars, label: Star rating, widget: number, value_type: int, min: 1, max: 5, default: 5 }
              - { name: text, label: Review text, widget: text, hint: "Paste it exactly as written." }
          - { name: _comment, label: Note to editors, widget: hidden, required: false }

  - name: memberships
    label: Memberships
    files:
      - name: season
        label: Membership season & links
        file: src/data/memberships.json
        description: >
          Controls the whole memberships section. Set the three months the
          season covers, and the page works out the days remaining and the
          prorated price for whoever is looking at it.
        fields:
          - name: season
            label: Current season
            widget: object
            fields:
              - { name: start, label: First day of the season, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD, picker_utc: true }
              - { name: end, label: Last day of the season, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD, picker_utc: true }
              - { name: label, label: Season name shown on the page, widget: string, hint: "Type it as it should appear, for example: June – August" }

          - name: nextSeason
            label: Next season
            widget: object
            hint: Shown once the current season closes.
            fields:
              - { name: label, label: Next season name, widget: string, required: false, hint: "Type it as it should appear, for example: September – November" }
              - { name: opensOn, label: First day of the next season, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD, picker_utc: true, required: false }
              - { name: _comment, label: Note to editors, widget: hidden, required: false }

          - name: pricing
            label: Pricing rules
            widget: object
            fields:
              - { name: currency, label: Currency symbol, widget: string, default: "$" }
              - { name: prorate, label: Charge only for the days that are left, widget: boolean, default: true }
              - { name: minDays, label: Close the season when fewer days remain than, widget: number, value_type: int, min: 1, max: 90, default: 30 }
              - { name: _comment, label: Note to editors, widget: hidden, required: false }

          - name: plans
            label: Plans
            widget: object
            fields:
              - name: indoorOutdoor
                label: Indoor & Outdoor
                widget: object
                fields:
                  - { name: name, label: Plan name, widget: string }
                  - { name: monthlyAmount, label: Price per month, widget: number, value_type: float, min: 0 }
                  - { name: totalAmount, label: Full season price, widget: number, value_type: float, min: 0 }
                  - { name: subscribeUrl, label: Get Membership link, widget: string, hint: "Paste the full link exactly as it appears in the browser" }
              - name: outdoor
                label: Outdoor
                widget: object
                fields:
                  - { name: name, label: Plan name, widget: string }
                  - { name: monthlyAmount, label: Price per month, widget: number, value_type: float, min: 0 }
                  - { name: totalAmount, label: Full season price, widget: number, value_type: float, min: 0 }
                  - { name: subscribeUrl, label: Get Membership link, widget: string, hint: "Paste the full link exactly as it appears in the browser" }

          - name: _comment
            label: Note to editors
            widget: hidden
            required: false
