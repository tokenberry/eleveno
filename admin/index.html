<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ELEVENO — Site Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Archivo',system-ui,sans-serif;background:#0E2350;color:#F5F0E4}
  #nc-root:empty::after{content:"Loading the editor…";display:block;padding:48px;text-align:center;color:#9FB0CE}
</style>
</head>
<body>
<div id="nc-root"></div>
<!-- Pinned to an exact version with an integrity hash on purpose. A floating
     range let unpkg serve any 3.x build at page load, unverified, into the one
     page that holds a GitHub token with write access to this repo. The browser
     now refuses to run this file unless it hashes to exactly the bytes below.
     Updating Decap means bumping BOTH the version and the hash:
       curl -sL https://unpkg.com/decap-cms@<VER>/dist/decap-cms.js \
         | openssl dgst -sha384 -binary | openssl base64 -A -->
<script src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"
        integrity="sha384-in6eHztHveqQ7uMZ1fDaKlDmacQLFuLH2wWrFTiymyuS8zQ5bixwL8U3AeRi8h/L"
        crossorigin="anonymous"></script>
</body>
</html>
